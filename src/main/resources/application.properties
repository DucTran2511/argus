# Default Profile (can be overridden with -Dspring.profiles.active=prod)
spring.profiles.active=local

# Server
server.port=${SERVER_PORT:8080}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# Scheduling   
spring.task.scheduling.pool.size=5
argus.scheduler.block-monitor.enabled=false

# Application-specific
argus.scheduler.block-monitor.interval-seconds=${BLOCK_MONITOR_INTERVAL:12}
argus.blockchain.chain=${BLOCKCHAIN_CHAIN:ethereum}
argus.blockchain.network=${BLOCKCHAIN_NETWORK:mainnet}
argus.blockchain.timeout-seconds=${BLOCKCHAIN_TIMEOUT:30}
argus.blockchain.retry-attempts=${BLOCKCHAIN_RETRY:3}
argus.ai.model=gpt-4o-mini
argus.telegram.enabled=false

# External APIs
dexscreener.api.base-url=https://api.dexscreener.com/latest/dex

# Logging
logging.level.root=INFO
logging.level.com.argus=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization,Content-Type,X-Total-Count,X-Request-Id
cors.allow-credentials=true
cors.max-age=3600

# Supabase Auth (JWT validation via JWKS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:}
