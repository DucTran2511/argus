# This profile is used for local development
# Run with: ./mvnw spring-boot:run -Dspring.profiles.active=local

# Database (PostgreSQL) - matches docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/argus
spring.datasource.username=jobuser
spring.datasource.password=jobpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

# Blockchain RPC
argus.blockchain.rpc-url=https://eth-mainnet.g.alchemy.com/v2/4Tjl71j2hyOvOqiw3a-4C

# AI Configuration (Optional for local dev)
argus.ai.openai-api-key=

# Telegram (Disabled for local)
argus.telegram.bot-token=
argus.telegram.enabled=false

# Development Optimizations
spring.jpa.show-sql=true
spring.devtools.restart.enabled=true
logging.level.com.argus=DEBUG

# Supabase Auth (replace with your Supabase project URL)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://<your-project>.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<your-project>.supabase.co/auth/v1/.well-known/jwks.json
