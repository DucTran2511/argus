# This profile is used for production deployment
# Run with: java -jar app.jar --spring.profiles.active=prod
# 
# All sensitive values MUST be provided via environment variables

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (Production Optimized)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=${REDIS_DATABASE:1}

# Blockchain RPC
argus.blockchain.rpc-url=${ETH_RPC_URL}

# AI Configuration
argus.ai.openai-api-key=${OPENAI_API_KEY}

# Telegram Bot
argus.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
argus.telegram.enabled=${TELEGRAM_ENABLED:false}

# Production Optimizations
spring.jpa.show-sql=false
spring.devtools.restart.enabled=false
logging.level.root=WARN
logging.level.com.argus=INFO
logging.level.org.hibernate.SQL=WARN

# CORS Configuration (Production)
# IMPORTANT: Set FRONTEND_URL environment variable to your actual frontend domain
# Example: https://dashboard.argus.com
cors.allowed-origins=${FRONTEND_URL}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Request-Id
cors.exposed-headers=Authorization,Content-Type,X-Total-Count,X-Request-Id
cors.allow-credentials=true
cors.max-age=3600
