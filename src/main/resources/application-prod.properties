# This profile is used for production deployment
# Run with: java -jar app.jar --spring.profiles.active=prod
# 
# All sensitive values MUST be provided via environment variables

# Database (PostgreSQL)
# Supports both direct URL or constructed from parts
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:argus}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (Production Optimized)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Blockchain RPC
argus.blockchain.rpc-url=${ETH_RPC_URL}

# Production Optimizations
spring.jpa.show-sql=false
spring.devtools.restart.enabled=false
logging.level.root=WARN
logging.level.com.argus=INFO
logging.level.org.hibernate.SQL=WARN

# CORS Configuration (Production)
# Supports env var or defaults to Vercel + localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://argus-ui.vercel.app,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Request-Id
cors.exposed-headers=Authorization,Content-Type,X-Total-Count,X-Request-Id
cors.allow-credentials=true
cors.max-age=3600


